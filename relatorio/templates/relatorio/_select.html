<div class="mb-3">
  <label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
  <select class="form-select {% if f.errors %}is-invalid{% endif %}" id="{{ f.id_for_label }}" name="{{ f.html_name }}" {% if f.field.disabled %}disabled{% endif %}>
    {% for v, r in f.field.choices %}<option value="{{ v }}" {% if f.value|stringformat:"s" == v|stringformat:"s" %}selected{% endif %}>{{ r }}</option>{% endfor %}
  </select>
  {% for e in f.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
  {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
</div>
