<div class="form-check mb-2">
  <input class="form-check-input {% if f.errors %}is-invalid{% endif %}" type="checkbox" id="{{ f.id_for_label }}" name="{{ f.html_name }}" {% if f.value %}checked{% endif %}>
  <label class="form-check-label" for="{{ f.id_for_label }}"><strong>{{ f.label }}</strong>{% if f.help_text %} <span class="mini text-secondary">— {{ f.help_text }}</span>{% endif %}</label>
  {% for e in f.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
</div>
