{% if pag.paginator.num_pages > 1 %}
<nav class="mt-3" aria-label="Paginação"><ul class="pagination pagination-sm">
  {% if pag.has_previous %}<li class="page-item"><a class="page-link" href="?{{ params }}&pagina={{ pag.previous_page_number }}">‹</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">página {{ pag.number }} de {{ pag.paginator.num_pages }}</span></li>
  {% if pag.has_next %}<li class="page-item"><a class="page-link" href="?{{ params }}&pagina={{ pag.next_page_number }}">›</a></li>{% endif %}
</ul></nav>
{% endif %}
